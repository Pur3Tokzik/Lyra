name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test the CLI without Ollama
        run: python -m lyra_app --version
      - name: Environment check without Ollama
        run: python -m lyra_app --doctor

  installer:
    name: install.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the installer parses
        run: bash -n install.sh
      - name: Help output is sane
        run: ./install.sh --help

  installer-e2e:
    name: install.sh end to end (no Ollama, no systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the installer non-interactively
        run: |
          export LYRA_DATA_DIR="$RUNNER_TEMP/lyra-data"
          export PATH="$HOME/.local/bin:$PATH"
          ./install.sh --yes --no-ollama --no-service
      - name: The launcher works
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          lyra --version
          lyra --doctor || true

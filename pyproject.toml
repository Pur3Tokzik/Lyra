[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "0.0.6"
description = "Local-first AI companion system: the brain decides, the model is a function."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Ricardo" }]
keywords = ["ai", "local", "companion", "ollama", "privacy"]

[project.scripts]
lyra = "lyra_app.main:main"

[tool.setuptools]
packages = [
    "lyra_app",
    "lyra_app.brain",
    "lyra_app.capabilities",
    "lyra_app.context",
    "lyra_app.core",
    "lyra_app.guideline",
    "lyra_app.interface",
    "lyra_app.journal",
    "lyra_app.memory",
    "lyra_app.model",
    "lyra_app.capabilities.builtin",
]

[tool.setuptools.package-data]
lyra_app = ["locales/*.json", "interface/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

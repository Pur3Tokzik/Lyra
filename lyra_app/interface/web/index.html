<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: rgba(20, 26, 42, 0.72);
    --panel-border: rgba(120, 160, 255, 0.18);
    --text: #e8ecf7;
    --muted: #93a0c0;
    --accent: #6ea8ff;
    --user: #2a3552;
    --lyra: rgba(40, 60, 110, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(90,130,255,0.18), transparent),
      radial-gradient(900px 500px at 100% 110%, rgba(180,90,255,0.14), transparent),
      var(--bg);
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; max-width: 860px; padding: 22px 20px 6px;
    display: flex; align-items: center; gap: 14px;
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 16px; flex: none;
    background: linear-gradient(145deg, var(--accent), #9b7bff);
    box-shadow: 0 0 26px rgba(110,168,255,0.45);
    transition: box-shadow .4s, filter .4s;
  }
  .avatar[data-state="focused"] { box-shadow: 0 0 30px rgba(110,255,190,0.5); filter: hue-rotate(70deg); }
  .avatar[data-state="curious"] { box-shadow: 0 0 30px rgba(255,210,110,0.5); filter: hue-rotate(-40deg); }
  .avatar[data-state="operational_frustration"] { filter: saturate(0.4); }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  main {
    width: 100%; max-width: 860px; flex: 1; padding: 8px 20px 20px;
    display: flex; flex-direction: column;
  }
  #log {
    flex: 1; min-height: 52vh; overflow-y: auto; padding: 14px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 18px; backdrop-filter: blur(14px);
  }
  .msg { margin: 8px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 76%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .msg.lyra .bubble { background: var(--lyra); border-bottom-left-radius: 4px; }
  .tag { color: var(--muted); font-size: .7rem; margin-top: 4px; }
  form { display: flex; gap: 10px; margin-top: 14px; }
  input[type=text] {
    flex: 1; padding: 13px 16px; border-radius: 14px; color: var(--text);
    background: var(--panel); border: 1px solid var(--panel-border); outline: none;
    backdrop-filter: blur(10px);
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 0 20px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(145deg, var(--accent), #9b7bff); color: #08101f;
    font-weight: 700;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div class="avatar" id="avatar" data-state="steady"></div>
    <div>
      <h1>__NAME__</h1>
      <div class="meta" id="meta">__LANGUAGE__ · __PERSONALITY__</div>
    </div>
  </header>
  <main>
    <div id="log"></div>
    <form id="composer" autocomplete="off">
      <input type="text" id="input" placeholder="__PLACEHOLDER__" aria-label="__PLACEHOLDER__">
      <button id="send" type="submit">__SEND__</button>
    </form>
  </main>
<script>
  const log = document.getElementById('log');
  const avatar = document.getElementById('avatar');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const T = {
    thinking: "__THINKING__",
    error: "__ERROR__",
    state: "__STATE_LABEL__"
  };

  function add(text, who, tag) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    if (tag) {
      const t = document.createElement('div');
      t.className = 'tag'; t.textContent = tag;
      wrap.appendChild(t);
    }
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  async function refreshState() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();
      avatar.dataset.state = data.state || 'steady';
      document.getElementById('meta').textContent =
        data.language + ' · ' + data.personality + ' · ' + T.state + ' ' + (data.state || '');
    } catch (e) { /* keep last known state */ }
  }

  async function turn(text) {
    add(text, 'user');
    input.value = '';
    send.disabled = true;
    const pending = add(T.thinking, 'lyra');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: text})
      });
      const data = await res.json();
      pending.remove();
      add(data.text || '', 'lyra', data.decision);
    } catch (e) {
      pending.remove();
      add(T.error, 'lyra');
    } finally {
      send.disabled = false;
      input.focus();
      refreshState();
    }
  }

  document.getElementById('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (text) turn(text);
  });

  add("__GREETING__", 'lyra');
  refreshState();
  input.focus();
</script>
</body>
</html>
